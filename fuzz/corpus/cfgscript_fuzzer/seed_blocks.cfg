# nested named blocks, with and without string labels
server "edge-1" {
  listen.port = 443;
  listen.addr = "0.0.0.0";

  tls {
    enabled = true;
    ciphers = ["TLS_AES_128_GCM_SHA256"];
  }

  upstream "backend" {
    weight = 5;
    health {
      interval = 10;
    }
  }
}

logging {
  level = "info";
}
