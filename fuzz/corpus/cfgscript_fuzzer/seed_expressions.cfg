# rich expressions: precedence, ternary, bitwise, shift, logical, unary
precedence = 2 + 3 * 4 - 10 / 2;
grouped = (2 + 3) * (4 - 1);
compare = 2 + 3 * 4 == 14;
flags = (1 << 0) | (1 << 3) | (1 << 7);
masked = 0xFF & ~0x0F;
shifted = 4096 >> 4;
logic = (1 < 2) && (3 >= 3) || false;
choice = (logic ? "yes" : "no");
negate = -(-5);
notted = !false;
mixed = 1 + 2.5 * 2;
