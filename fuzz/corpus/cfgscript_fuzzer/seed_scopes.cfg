# identifier references resolving across nested scopes
base_port = 8000;
replicas = 3;

cluster {
  # references the top-level scope
  port = base_port + 1;
  total = replicas * 2;

  shard "a" {
    # references the enclosing block scope and the root scope
    local_port = port + 10;
    capacity = total * 100;
  }
}

summary = base_port + replicas;
